[project]
name = "syringe-perfusion"
version = "0.2.0b5"
description = "A4 syringe pump control tools for USB virtual COM operation"
requires-python = ">=3.9"
dependencies = [
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pyinstaller>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
